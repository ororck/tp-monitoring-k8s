apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      volumes:
        - name: discord-webhook
          secret: null
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: discord-webhook
