apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: discord
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h

    receivers:
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager-discord/url
